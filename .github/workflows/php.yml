name: PHP
on: [pull_request]
jobs:
  tests:
    strategy:
      matrix:
        operating-system: [ubuntu-latest]
        php-versions: ['7.4', '8.0', '8.1']
        exceptions-version: ['^1.0', '^2.0']
    runs-on: ${{ matrix.operating-system }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-versions }}
          coverage: xdebug
          ini-values: memory_limit=-1

      - name: Validate composer.json and composer.lock
        run: composer validate

      - name: Get composer cache directory
        id: composercache
        run: echo "::set-output name=dir::$(composer config cache-files-dir)"

      - name: Cache composer dependencies
        id: composer-cache
        uses: actions/cache@v6
        with:
          path: ${{ steps.composercache.outputs.dir }}
          key: ${{ matrix.php-versions }}-composer-${{ hashFiles('**/composer.json') }}
          restore-keys: ${{ matrix.php-versions }}-composer-

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress --no-suggest

      - name: Resolve supported exception dependency
        run: composer update --with 'coisa/exceptions:${{ matrix.exceptions-version }}' --with-all-dependencies --no-interaction --no-progress

      - name: Lint PHP
        run: composer run-script lint

      - name: Run test suite
        run: composer run-script test
